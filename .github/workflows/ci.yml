name: ARES Core CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check shell script syntax
        run: bash -n scripts/*.sh
      - name: Smoke test LAN credential provisioning
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          bash scripts/provision-lan-pair.sh "$tmp/bundles"
          test "$(wc -c < "$tmp/bundles/a/session.key")" -eq 32
          cmp "$tmp/bundles/a/session.key" "$tmp/bundles/b/session.key"
          test "$(stat -c '%a' "$tmp/bundles/a/session.key")" = 600
          test "$(stat -c '%a' "$tmp/bundles/b/session.key")" = 600
          test ! -e "$tmp/bundles/a/ca.key"
          test ! -e "$tmp/bundles/b/ca.key"
          test "$(wc -c < "$tmp/bundles/a/peer.pin")" -eq 65
          test "$(wc -c < "$tmp/bundles/b/peer.pin")" -eq 65
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Build native peer
        run: cargo build --bin ares-peer
      - name: Build documentation
        run: cargo doc --no-deps --all-features
      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: ares-cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error

  directional-packet-drop:
    name: Real directional packet-drop proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install network test utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 openssl
      - name: Build native peer
        run: cargo build --bin ares-peer
      - name: Run isolated veth packet-drop test
        run: sudo bash scripts/test-directional-packet-drop.sh
