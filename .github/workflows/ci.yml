name: ARES Core CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Build native peer
        run: cargo build --bin ares-peer
      - name: Build documentation
        run: cargo doc --no-deps --all-features

  directional-packet-drop:
    name: Real directional packet-drop proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install network test utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 openssl
      - name: Build native peer
        run: cargo build --bin ares-peer
      - name: Run isolated veth packet-drop test
        run: sudo bash scripts/test-directional-packet-drop.sh
