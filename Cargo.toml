[package]
name = "ares-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "ARES authenticated native peer runtime and directional reliability core"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ares-peer"
path = "src/bin/ares-peer.rs"

[dependencies]
anyhow = "1.0.100"
chacha20poly1305 = "0.10.1"
hex = "0.4.3"
hkdf = "0.12.4"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
